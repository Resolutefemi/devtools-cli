[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "renance-dt"
version = "3.1.0"
description = "Renance DevTools - One command to rule them all"
authors = [{name = "Renance", email = "hello@renance.dev"}]
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "qrcode[pil]>=7.4.0",
    "pillow>=10.0.0",
    "psutil>=5.9.0",
    "pyjokes>=0.6.0"
]

[project.scripts]
dt = "dt_cli.cli:cli"

[project.optional-dependencies]
media = ["ffmpeg-python>=0.2.0"]
download = ["yt-dlp>=2024.0.0"]
full = ["ffmpeg-python>=0.2.0", "yt-dlp>=2024.0.0", "cairosvg>=2.7.0", "pydub>=0.25.1"]